services:
  - type: web
    name: uxbench-demo
    runtime: docker
    plan: free
    region: virginia
    healthCheckPath: /api/health
    maxShutdownDelaySeconds: 60
    envVars:
      - key: UXBENCH_HOST
        value: 0.0.0.0
      - key: UXBENCH_DATA_DIR
        value: /tmp/uxbench-data
      - key: UXBENCH_ACCESS_USER
        value: uxbench
      - key: UXBENCH_ACCESS_PASSWORD
        sync: false
